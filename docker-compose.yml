version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web_app
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./app:/app
      - ./git-data:/git-data
    environment:
      - GIT_USERNAME=LIM WEI HAO
      - GIT_EMAIL=2402242@sit.singaporetech.edu.sg
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  db:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=2402242@sit.singaporetech.edu.sg
      - POSTGRES_DB=webapp_db
    volumes:
      - ./db-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d webapp_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  app-network:
    driver: bridge